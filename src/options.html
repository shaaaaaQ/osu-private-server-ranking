<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>osu! Private Server Ranking 設定</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>設定</h1>
      <p id="status" aria-live="polite"></p>

      <section>
        <div class="section-title"><h2>スコア取得</h2></div>
        <label class="toggle">
          <input id="lazy-load" type="checkbox" checked>
          <span>タブを開いたときに取得する</span>
        </label>
        <p class="permission-note">オンの場合、プライベートサーバータブを開くまで通信しません。</p>
      </section>

      <section>
        <div class="section-title"><h2>登録済みサーバー</h2></div>
        <div id="server-list"></div>
      </section>

      <section>
        <div class="section-title"><h2>サーバーを追加</h2></div>
        <form id="add-server-form" class="server-card server-card--new">
          <label class="field">
            <span>ドメイン</span>
            <input name="domain" type="text" required placeholder="example.test">
            <small>API URLではなく、サーバーのドメインを入力します。</small>
          </label>
          <label class="field"><span>表示名</span><input name="name" type="text" required placeholder="Server A"></label>
          <label class="field"><span>タイムゾーン</span><input name="timezone" type="text" required value="UTC" placeholder="Asia/Tokyo"></label>
          <label class="field"><span>自分のユーザーID</span><input name="myUserId" type="number" min="1" step="1" placeholder="任意"></label>
          <div class="server-actions">
            <button class="save" type="submit">サーバーを追加</button>
            <output aria-live="polite"></output>
          </div>
        </form>
        <p class="permission-note">追加時にAPIへのアクセス許可を求めます。</p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
