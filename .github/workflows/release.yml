name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  extensions:
    name: Browser extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 11.6.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install, check, and build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
      - name: Package Chrome extension
        working-directory: dist/chrome
        run: zip -r ../../osu-private-server-ranking-chrome.zip .
      - name: Package Firefox extension
        working-directory: dist/firefox
        run: zip -r ../../osu-private-server-ranking-firefox.xpi .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extensions
          path: |
            osu-private-server-ranking-chrome.zip
            osu-private-server-ranking-firefox.xpi
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
